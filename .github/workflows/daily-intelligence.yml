name: InsurIntel HK Daily Morning Intelligence

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'loop/*'
  pull_request:
    branches:
      - main
  schedule:
    # Runs at 22:30 UTC every day -> 06:30 AM HKT (Hong Kong Time, UTC+8)
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  daily-intelligence:
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up Python (for Privacy Sanitizer & Slide Compilers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Dependencies
        run: |
          npm install
          pip install -r requirements.txt

      - name: 4.5 Run Deterministic App Build & Automated Test Suite
        run: |
          npm run build:app
          npm test

      - name: 5. Execute Daily Market Search & Generate Web Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run start:search

      - name: 5.5 Stage Public Web Assets for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_PUBLISH_MODE: allowlist
        run: |
          node scripts/stage_pages_site.js

      - name: 6. Setup GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 7. Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 8. Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 9. Commit Intelligence Snapshots Back to Repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add dist/previous_snapshot.json dist/morning_briefing.txt || true
          git diff --staged --quiet || git commit -m "chore(auto): daily intelligence snapshot update [skip ci]"
          git push || true
